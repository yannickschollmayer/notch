name: Build VoiceInk Notch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 330
    env:
      LOG: ${{ github.workspace }}/build.log
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout patches
        uses: actions/checkout@v4
        with:
          path: fork

      - name: Report start
        run: bash fork/ci/report.sh running

      - name: Fetch upstream VoiceInk and apply patches
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG") 2>&1
          SHA=$(tr -d '[:space:]' < fork/UPSTREAM)
          git clone -q https://github.com/Beingpax/VoiceInk.git src
          cd src
          git checkout -q "$SHA"
          for p in $(ls ../fork/patches/*.patch | sort); do
            echo "Applying $(basename "$p")"
            git apply --whitespace=nowarn "$p" || { echo "Patch failed: $p"; exit 1; }
          done
          git status --short

      - name: Select Xcode
        run: |
          set -uo pipefail
          exec > >(tee -a "$LOG") 2>&1
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | python3 -c "
          import re, sys
          apps = [l.strip() for l in sys.stdin if l.strip()]
          key = lambda s: [int(n) for n in re.findall(r'\d+', s.rsplit('/', 1)[-1])]
          print(max(apps, key=key) if apps else '')
          ") || XCODE=""
          if [ -n "$XCODE" ]; then
            echo "Using $XCODE"
            sudo xcode-select -s "$XCODE/Contents/Developer"
          fi
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain || echo "Metal toolchain download skipped"

      - name: Cache whisper.xcframework
        uses: actions/cache@v4
        with:
          path: ~/VoiceInk-Dependencies/whisper.cpp/build-apple
          key: whisper-xcframework-b5454

      - name: Prepare whisper.xcframework
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG") 2>&1
          DEST="$HOME/VoiceInk-Dependencies/whisper.cpp/build-apple"
          if [ -d "$DEST/whisper.xcframework" ]; then
            echo "whisper.xcframework from cache"
            exit 0
          fi
          mkdir -p "$DEST" "$RUNNER_TEMP/whisper"
          gh release download b5454 --repo ggml-org/whisper.cpp --pattern 'whisper-*-xcframework.zip' --dir "$RUNNER_TEMP/whisper"
          unzip -q "$RUNNER_TEMP"/whisper/*.zip -d "$RUNNER_TEMP/whisper/x"
          FW=$(find "$RUNNER_TEMP/whisper/x" -type d -name whisper.xcframework | head -1)
          cp -R "$FW" "$DEST/"
          ls "$DEST/whisper.xcframework"

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: dd
          key: dd-${{ hashFiles('fork/UPSTREAM') }}-${{ github.run_id }}
          restore-keys: |
            dd-${{ hashFiles('fork/UPSTREAM') }}-

      - name: Resolve Swift packages
        working-directory: src
        run: |
          set -uo pipefail
          defaults write com.apple.dt.Xcode IDEPackageEnablePrebuilts -bool NO
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          export GIT_TERMINAL_PROMPT=0
          xcodebuild -version
          ( while true; do
              sleep 60
              echo "--- $(date +%H:%M:%S) busy processes:"
              ps -Ao pid,etime,%cpu,command | grep -E 'git|swift|curl|xcodebuild|lfs|ssh|clang|unzip|ditto' | grep -v grep | cut -c1-230 | head -25
            done ) &
          perl -e 'alarm shift; exec @ARGV' 1500 xcodebuild -resolvePackageDependencies \
            -project VoiceInk.xcodeproj -scheme VoiceInk \
            -derivedDataPath "$GITHUB_WORKSPACE/dd" -scmProvider system 2>&1 | tee -a "$LOG"

      - name: Build (ad-hoc signed, like make local)
        working-directory: src
        run: |
          set -uo pipefail
          echo "Building... (full log goes to build.log, progress every 2 minutes)"
          xcodebuild -project VoiceInk.xcodeproj -scheme VoiceInk -configuration Release \
            -derivedDataPath "$GITHUB_WORKSPACE/dd" \
            -xcconfig LocalBuild.xcconfig \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES DEVELOPMENT_TEAM="" \
            CODE_SIGN_ENTITLEMENTS="$PWD/VoiceInk/VoiceInk.local.entitlements" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) LOCAL_BUILD' \
            -skipPackagePluginValidation -skipMacroValidation \
            -scmProvider system -disableAutomaticPackageResolution \
            build >> "$LOG" 2>&1 &
          PID=$!
          while kill -0 "$PID" 2>/dev/null; do
            sleep 120
            echo "$(date +%H:%M) compiled=$(grep -cE '^(CompileSwift|CompileC|CompileMetalFile|SwiftCompile) ' "$LOG") last: $(grep -E '^(CompileSwift|CompileC|CompileMetalFile|SwiftCompile|Ld|ProcessProduct) ' "$LOG" | tail -1 | cut -c1-160)"
            echo "      tail: $(tail -n 1 "$LOG" | cut -c1-200)"
            bash "$GITHUB_WORKSPACE/fork/ci/report.sh" building > /dev/null 2>&1 || true
          done
          RC=0
          wait "$PID" || RC=$?
          if [ "$RC" -ne 0 ]; then
            grep -E "error:" "$LOG" | head -80
            exit 1
          fi
          APP_PATH="$GITHUB_WORKSPACE/dd/Build/Products/Release/VoiceInk.app"
          test -d "$APP_PATH"
          rm -rf "$HOME/Downloads/VoiceInk.app"
          ditto "$APP_PATH" "$HOME/Downloads/VoiceInk.app"
          xattr -cr "$HOME/Downloads/VoiceInk.app"

      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dd
          key: dd-${{ hashFiles('fork/UPSTREAM') }}-${{ github.run_id }}

      - name: Re-sign with a stable requirement and package
        run: |
          set -uo pipefail
          exec > >(tee -a "$LOG") 2>&1
          APP="$HOME/Downloads/VoiceInk.app"
          # Designated requirement = bundle identifier, so macOS keeps microphone/accessibility
          # permissions across updates instead of asking again after every build.
          codesign --force --sign - --preserve-metadata=entitlements,flags,runtime \
            --requirements '=designated => identifier "com.prakashjoshipax.VoiceInk"' "$APP"
          codesign --verify --verbose=2 "$APP" || echo "codesign verify reported a problem"
          codesign -d -r- "$APP" || true
          cd "$HOME/Downloads"
          ditto -c -k --sequesterRsrc --keepParent VoiceInk.app "$GITHUB_WORKSPACE/VoiceInk-Notch.zip"
          ls -la "$GITHUB_WORKSPACE/VoiceInk-Notch.zip"

      - name: Publish release
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG") 2>&1
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$GITHUB_WORKSPACE/VoiceInk-Notch.zip" \
            --target "$GITHUB_SHA" \
            --title "VoiceInk Notch (Build $GITHUB_RUN_NUMBER)" \
            --notes "Automatisch gebaut aus VoiceInk $(cut -c1-7 fork/UPSTREAM) mit den Patches aus diesem Repo. Installation: siehe README."

      - name: Report result
        if: always()
        run: bash fork/ci/report.sh "${{ job.status }}"
